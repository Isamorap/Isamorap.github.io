<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 907" width="1600" height="907"
  role="img" aria-label="Composición geométrica abstracta">
  <title>Composición geométrica abstracta</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2733" />
      <stop offset=".55" stop-color="#24313f" />
      <stop offset="1" stop-color="#0f1720" />
    </linearGradient>
    <linearGradient id="haz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".18" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8fb3d9" stop-opacity=".35" />
      <stop offset="1" stop-color="#8fb3d9" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1600" height="907" fill="url(#fondo)" />

  <!-- Anillos concéntricos: la idea de "superficies apiladas" del laboratorio. -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".12">
    <circle cx="520" cy="470" r="120" />
    <circle cx="520" cy="470" r="220" />
    <circle cx="520" cy="470" r="320" stroke-opacity=".08" />
    <circle cx="520" cy="470" r="430" stroke-opacity=".05" />
  </g>
  <ellipse cx="520" cy="470" rx="620" ry="420" fill="url(#halo)" />

  <!-- Rejilla: el esqueleto que todos los estilos conservan. -->
  <g stroke="#ffffff" stroke-opacity=".07">
    <path d="M0 150h1600M0 320h1600M0 490h1600M0 660h1600M0 830h1600" />
    <path d="M220 0v907M480 0v907M740 0v907M1000 0v907M1260 0v907M1500 0v907" />
  </g>

  <!-- Cuatro planos de color, como una paleta de tokens en negativo. -->
  <g>
    <rect x="880" y="250" width="200" height="200" rx="24" fill="#e8eef5" fill-opacity=".9" />
    <rect x="1060" y="250" width="200" height="200" rx="100" fill="#7fb3e8" fill-opacity=".85" />
    <rect x="880" y="430" width="200" height="200" rx="24" fill="#f5f0e6" fill-opacity=".85" />
    <rect x="1060" y="430" width="200" height="200" rx="24" fill="#ffffff" fill-opacity=".12"
      stroke="#ffffff" stroke-opacity=".35" />
  </g>

  <rect x="0" y="330" width="1600" height="240" fill="url(#haz)" />
  <rect x="0" y="0" width="1600" height="907" fill="none" stroke="#000000" stroke-opacity=".18"
    stroke-width="2" />
</svg>
